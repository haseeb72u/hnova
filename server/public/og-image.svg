<!--
  OG Image source (1200 × 630).
  Convert to PNG before deploying:
    npx sharp-cli og-image.svg -o og-image.png -f png -w 1200 -h 630
  or use an online SVG-to-PNG converter.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000"/>

  <!-- Top + bottom green accent lines -->
  <rect x="0" y="0"   width="1200" height="5" fill="#2fbf4f" opacity="0.6"/>
  <rect x="0" y="625" width="1200" height="5" fill="#2fbf4f" opacity="0.6"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1c1c1f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- Radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#2fbf4f" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#000"    stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand name -->
  <text x="600" y="265"
        font-family="system-ui,-apple-system,sans-serif"
        font-weight="700" font-size="110" fill="#ffffff"
        text-anchor="middle" letter-spacing="-3">H<tspan fill="#2fbf4f">Nova</tspan></text>

  <!-- Tagline -->
  <text x="600" y="360"
        font-family="system-ui,-apple-system,sans-serif"
        font-weight="600" font-size="34" fill="#8a8f98"
        text-anchor="middle">We automate businesses.</text>

  <!-- URL pill -->
  <rect x="474" y="400" width="252" height="52" rx="26" fill="#0a0a0a" stroke="#1c1c1f" stroke-width="1.5"/>
  <text x="600" y="433"
        font-family="system-ui,-apple-system,sans-serif"
        font-weight="600" font-size="22" fill="#2fbf4f"
        text-anchor="middle">hnova.tech</text>
</svg>
